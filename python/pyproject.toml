[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "neo-compute-client"
version = "0.2.0"
description = "Read-only GPU compute discovery client and MCP tool server"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
mcp = ["mcp>=1.10"]
test = ["pytest>=8", "respx>=0.21"]

[project.scripts]
neo-compute-mcp = "neo_compute.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/neo_compute"]
